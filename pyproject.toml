[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kajenn-gramlot"
version = "0.0.1"
description = "Gramlot applications for kajenn: a minimal one and one on kajenn-orchestra, with asqueel"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Genropy Team", email = "info@softwell.it"}
]
keywords = ["asgi", "kajenn", "gramlot", "asqueel", "spa"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
]

dependencies = [
    "kajenn>=0.8.0",
    "gramlot>=0.3.35",
    "kajenn-db[asqueel]>=0.1.0",
]

[project.optional-dependencies]
orchestra = ["kajenn-orchestra>=0.5.1"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.urls]
Repository = "https://github.com/kajenn-org/kajenn-gramlot"

[tool.hatch.build.targets.wheel]
packages = ["src/kajenn_gramlot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
